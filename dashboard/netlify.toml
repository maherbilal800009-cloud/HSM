[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/api/*"
to = "https://respectful-forgiveness-production-41c3.up.railway.app/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*.js"

  [headers.values]
  Content-Type = "application/javascript; charset=utf-8"
